name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: uptimeflare-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.3
        with:
          terraform_version: 1.6.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'npm'

      # Automatically get an account id via the API Token
      # if secrets.CLOUDFLARE_ACCOUNT_ID is not set.
      - name: Fetch Account ID
        id: fetch_account_id
        run: |
          if [[ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            echo "Using provided CLOUDFLARE_ACCOUNT_ID from secrets."
          else
            ACCOUNT_ID=$(curl -X GET "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type:application/json" | jq ".result[0].id" -r)
            if [[ "$ACCOUNT_ID" == "null" ]]; then
              echo "Failed to get an account id, please make sure you have set up CLOUDFLARE_API_TOKEN correctly!"
              exit 1
            fi
          fi
          echo 'account_id='$ACCOUNT_ID >> $GITHUB_OUTPUT

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install packages
        run: |
          npm install
          cd worker
          npm install

      - name: Build worker
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$BARK_DEVICE_KEY" ]]; then
            echo "Missing GitHub Actions secret BARK_DEVICE_KEY."
            exit 1
          fi

          # Keep the Bark device key out of the public repository and out of the
          # Pages build. Inject it only for the Worker bundle, then restore the
          # checked-in config before the next workflow step.
          cp uptime.config.ts /tmp/uptime.config.ts
          trap 'cp /tmp/uptime.config.ts uptime.config.ts' EXIT

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("uptime.config.ts")
          config = path.read_text()
          placeholder = "__BARK_DEVICE_KEY__"
          if placeholder not in config:
              raise SystemExit("Bark device-key placeholder not found in uptime.config.ts")
          config = config.replace(placeholder, os.environ["BARK_DEVICE_KEY"])
          path.write_text(config)
          PY

          cd worker
          npx wrangler deploy src/index.ts --outdir dist --dry-run

      - name: Build page
        run: |
          npx @cloudflare/next-on-pages

      - name: Create D1 database and tables
        run: |
          python3 deploy/init_d1.py  # This sets D1_ID in GITHUB_ENV

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}

      - name: Migrate state from KV (if needed)
        run: |
          python3 deploy/migrate_kv.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          D1_ID: ${{ env.D1_ID }}

      - name: Deploy using Terraform
        # Terraform state is intentionally ephemeral in this project, so discover
        # and import resources that may already exist before each apply.
        run: |
          set -euo pipefail

          terraform init -upgrade
          terraform validate

          ZONE_RESP=$(curl -sS             "https://api.cloudflare.com/client/v4/zones?name=novoagatto.com&account.id=$TF_VAR_CLOUDFLARE_ACCOUNT_ID&per_page=50"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json")

          if ! echo "$ZONE_RESP" | jq -e '.success == true' > /dev/null; then
            echo "Unable to resolve novoagatto.com zone. The API token needs Zone Read permission."
            echo "$ZONE_RESP" | jq .
            exit 1
          fi

          ZONE_ID=$(echo "$ZONE_RESP" | jq -r '.result[0].id // empty')
          if [[ -z "$ZONE_ID" ]]; then
            echo "Zone novoagatto.com was not found in this Cloudflare account."
            exit 1
          fi
          export TF_VAR_CLOUDFLARE_ZONE_ID="$ZONE_ID"

          DO_RESP=$(curl -sS             "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/workers/durable_objects/namespaces?per_page=1000"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          if echo "$DO_RESP" | jq -e '.result[] | select(.script == "uptimeflare_worker" and .class == "RemoteChecker")' > /dev/null; then
            echo "Existing Durable Object namespace found for uptimeflare_worker RemoteChecker. No migration needed."
          else
            echo "No existing Durable Object namespace found for uptimeflare_worker RemoteChecker. Need migration."
            export TF_VAR_enable_do_migration=true
          fi

          echo "Try importing existing core resources..."
          terraform import cloudflare_d1_database.uptimeflare_d1 "$TF_VAR_CLOUDFLARE_ACCOUNT_ID/$D1_ID"
          terraform import cloudflare_workers_script.uptimeflare_worker "$TF_VAR_CLOUDFLARE_ACCOUNT_ID/uptimeflare_worker" || echo "WARNING: Worker script import failed, continuing..."
          terraform import cloudflare_workers_cron_trigger.uptimeflare_worker_cron "$TF_VAR_CLOUDFLARE_ACCOUNT_ID/uptimeflare_worker" || echo "WARNING: Cron trigger import failed, continuing..."
          terraform import cloudflare_pages_project.uptimeflare "$TF_VAR_CLOUDFLARE_ACCOUNT_ID/uptimeflare" || echo "WARNING: Pages project import failed, continuing..."

          echo "Try importing existing custom-domain resources..."
          terraform import cloudflare_pages_domain.uptimeflare_status "$TF_VAR_CLOUDFLARE_ACCOUNT_ID/uptimeflare/status.novoagatto.com" || echo "Pages custom domain does not exist yet; Terraform will create it."

          DNS_RESP=$(curl -sS             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=status.novoagatto.com&per_page=100"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json")

          if ! echo "$DNS_RESP" | jq -e '.success == true' > /dev/null; then
            echo "Unable to inspect DNS records. The API token needs DNS Write permission for novoagatto.com."
            echo "$DNS_RESP" | jq .
            exit 1
          fi

          DNS_ID=$(echo "$DNS_RESP" | jq -r '.result[0].id // empty')
          if [[ -n "$DNS_ID" ]]; then
            terraform import cloudflare_dns_record.uptimeflare_status "$ZONE_ID/$DNS_ID" || echo "WARNING: DNS record import failed, continuing..."
          fi

          IDP_RESP=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/access/identity_providers" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          if ! echo "$IDP_RESP" | jq -e '.success == true' > /dev/null; then
            echo "Unable to inspect Access identity providers. The API token needs Access: Organizations, Identity Providers, and Groups Write."
            echo "$IDP_RESP" | jq .
            exit 1
          fi

          CLOUDFLARE_IDP_ID=$(echo "$IDP_RESP" | jq -r '.result[] | select(.type == "cloudflare") | .id' | head -n 1)
          if [[ -n "$CLOUDFLARE_IDP_ID" ]]; then
            terraform import cloudflare_zero_trust_access_identity_provider.cloudflare "accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/$CLOUDFLARE_IDP_ID" || echo "WARNING: Cloudflare identity provider import failed, continuing..."
          fi

          POLICY_RESP=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/access/policies?per_page=1000" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          if ! echo "$POLICY_RESP" | jq -e '.success == true' > /dev/null; then
            echo "Unable to inspect Access policies. The API token needs Access: Apps and Policies Write."
            echo "$POLICY_RESP" | jq .
            exit 1
          fi

          ACCESS_POLICY_ID=$(echo "$POLICY_RESP" | jq -r '.result[] | select(.name == "Allow Cloudflare account members") | .id' | head -n 1)
          if [[ -n "$ACCESS_POLICY_ID" ]]; then
            terraform import cloudflare_zero_trust_access_policy.uptimeflare_status "$TF_VAR_CLOUDFLARE_ACCOUNT_ID/$ACCESS_POLICY_ID" || echo "WARNING: Access policy import failed, continuing..."
          fi

          ACCESS_RESP=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=1000" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          if ! echo "$ACCESS_RESP" | jq -e '.success == true' > /dev/null; then
            echo "Unable to inspect Cloudflare Access applications. The API token needs Access: Apps and Policies Write."
            echo "$ACCESS_RESP" | jq .
            exit 1
          fi

          ACCESS_APP_ID=$(echo "$ACCESS_RESP" | jq -r '
            .result[]
            | select(
                .domain == "status.novoagatto.com"
                or .name == "Miau Infrastructure Status"
                or any(.destinations[]?; .uri == "status.novoagatto.com")
              )
            | .id
          ' | head -n 1)

          if [[ -n "$ACCESS_APP_ID" ]]; then
            terraform import cloudflare_zero_trust_access_application.uptimeflare_status "accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/$ACCESS_APP_ID" || echo "WARNING: Access application import failed, continuing..."
          fi

          terraform apply -auto-approve -input=false

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          D1_ID: ${{ env.D1_ID }}

      # Currently Terraform Cloudflare provider doesn't support direct upload, use wrangler to upload instead.
      - name: Upload pages
        run: |
          npx wrangler pages deploy .vercel/output/static --project-name uptimeflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
